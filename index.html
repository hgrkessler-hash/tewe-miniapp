<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rusche TEWE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; --bg:#fff; --tx:#17202a; --sec:#f3f6f4; --bt:#1f7a4d; --btx:#fff; --line:#d5ddd8; }
  html, body { margin:0; background:var(--bg); color:var(--tx); font:16px/1.35 system-ui, sans-serif; }
  header, main { padding:12px; }
  h1 { font-size:18px; margin:0 0 8px; }
  button, .row { border:1px solid var(--line); background:var(--sec); color:var(--tx); border-radius:10px; }
  button { padding:8px 10px; margin:4px 4px 0 0; }
  button.on, button.primary { background:var(--bt); color:var(--btx); border-color:var(--bt); }
  .valve { display:flex; gap:8px; align-items:center; padding:8px; margin:6px 0; }
  .muted { opacity:.75; font-size:13px; }
  input, select { background:var(--bg); color:var(--tx); border:1px solid var(--line); border-radius:8px; padding:8px; }
</style>
</head>
<body>
<header><h1 id="title">Rusche TEWE</h1><div id="sub" class="muted"></div></header>
<main id="app"></main>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  function applyTheme() {
    var t = (tg && tg.themeParams) || {};
    var root = document.documentElement;
    if (t.bg_color) root.style.setProperty("--bg", t.bg_color);
    if (t.text_color) root.style.setProperty("--tx", t.text_color);
    if (t.secondary_bg_color) root.style.setProperty("--sec", t.secondary_bg_color);
    if (t.button_color) root.style.setProperty("--bt", t.button_color);
    if (t.button_text_color) root.style.setProperty("--btx", t.button_text_color);
    if (tg && tg.colorScheme === "dark") root.style.colorScheme = "dark";
  }
  applyTheme();
  if (tg) tg.onEvent("themeChanged", applyTheme);

  function standText() {
    var query = "";
    try { query = new URLSearchParams(location.search).get("s") || ""; } catch (e) { query = ""; }
    if (query.indexOf("v1") === 0 || query.indexOf("z:") === 0) return query;
    var hash = "";
    try { hash = decodeURIComponent((location.hash || "").replace(/^#/, "")); } catch (e2) { hash = ""; }
    if (hash.indexOf("tgWebApp") === 0) return "";
    if (hash.indexOf("v1") === 0) return hash.split("&")[0];
    return "";
  }
  function parse(text) {
    if (text.indexOf("v1a|") === 0) {
      var stalls = [];
      text.slice(4).split("~").forEach(function (block) {
        if (block.indexOf("Haus|") !== 0 && block.indexOf("Moor|") !== 0) return;
        var one = parse("v1|" + block);
        if (one.art === "stall") stalls.push(one);
      });
      return { art: "alle", stalls: stalls, current: -1 };
    }
    if (text.indexOf("v1s|") === 0) {
      var stalls = [];
      text.slice(4).split(";").forEach(function (part) {
        var i = part.indexOf(":");
        if (i < 1) return;
        var mark = part.slice(0, i);
        stalls.push({ standort: mark === "H" ? "Haus" : "Moor", stall: part.slice(i + 1) });
      });
      return { art: "stalls", stalls: stalls };
    }
    var bits = text.split("|");
    if (bits[0] !== "v1" || bits.length < 5) return { art: "leer" };
    var valves = [];
    (bits[3] || "").split(";").forEach(function (row) {
      if (!row) return;
      var c = row.split(",");
      if (!c[0]) return;
      valves.push({ nr: Number(c[0]), tiere: c[1] || "", korrektur: c[2] || "", minuten: c[3] || "" });
    });
    var jobs = [];
    (bits[4] || "").split("/").forEach(function (bit) {
      var j = bit.split(":");
      if (j.length === 3 && j[0]) jobs.push({ id: Number(j[0]), typ: j[1], status: j[2] });
    });
    return { art: "stall", standort: bits[1], stall: bits[2], valves: valves, jobs: jobs };
  }
  function vor(minuten) {
    var n = Number(minuten);
    if (!minuten || !isFinite(n)) return "";
    var h = Math.floor(n / 60), m = n % 60;
    return "vor " + h + " Std. " + m + " Min.";
  }
  function send(obj) {
    var raw = JSON.stringify(obj);
    if (tg && tg.sendData) tg.sendData(raw);
    else document.getElementById("sub").textContent = "Nur in Telegram.";
  }
  function inflateZ(value) {
    if (!value || value.indexOf("z:") !== 0 || typeof DecompressionStream !== "function") {
      return Promise.resolve(value || "");
    }
    var b64 = value.slice(2).replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
    return new Response(stream).text();
  }
  var state = { art: "leer" };
  var picked = {};
  var typ = "FUTTER";
  var delta = 5;
  var tage = 5;
  var sperren = 1;
  var anzahl = 1;
  var art = "Tot";
  var ursache = "Kümmerer";

  function render() {
    var app = document.getElementById("app");
    app.innerHTML = "";
    if (state.art === "alle" && state.current < 0) {
      document.getElementById("title").textContent = "Stall wählen";
      document.getElementById("sub").textContent = "Tippen zeigt die Ventile.";
      state.stalls.forEach(function (s, index) {
        var b = document.createElement("button");
        b.textContent = s.stall;
        b.onclick = function () { state.current = index; picked = {}; render(); };
        app.appendChild(b);
      });
      return;
    }
    if (state.art === "stalls") {
      document.getElementById("title").textContent = "Stall wählen";
      document.getElementById("sub").textContent = "Dieser Knopf hat keinen Ventilstand. Bitte den neuen Knopf TEWE öffnen.";
      state.stalls.forEach(function (s) {
        var b = document.createElement("button");
        b.textContent = s.stall;
        app.appendChild(b);
      });
      return;
    }
    var view = state.art === "alle" ? state.stalls[state.current] : state;
    if (!view || view.art !== "stall") {
      document.getElementById("title").textContent = "Kein Stand";
      document.getElementById("sub").textContent = "Im Chat /start senden, dann TEWE öffnen.";
      return;
    }
    document.getElementById("title").textContent = view.stall;
    document.getElementById("sub").textContent = view.standort + " · Haken, dann eine Aktion für alle";
    if (state.art === "alle") {
      var back = document.createElement("button");
      back.textContent = "Andere Ställe";
      back.onclick = function () { state.current = -1; picked = {}; render(); };
      app.appendChild(back);
    }
    view.valves.forEach(function (v) {
      if (view.standort === "Moor" && v.nr >= 270 && v.nr <= 290) return;
      var row = document.createElement("label");
      row.className = "valve";
      var box = document.createElement("input");
      box.type = "checkbox";
      box.onchange = function () { picked[v.nr] = box.checked; };
      row.appendChild(box);
      var text = document.createElement("div");
      text.innerHTML = "<b>" + v.nr + "</b> · Tiere " + (v.tiere || "–") + " · Korr. " + (v.korrektur || "–")
        + "<div class='muted'>" + (vor(v.minuten) || "letzte Fütterung unbekannt") + "</div>";
      row.appendChild(text);
      app.appendChild(row);
    });
    var actions = document.createElement("div");
    [["FUTTER", "Futter"], ["SPERREN", "Sperren"], ["VERLUST", "Verlust"], ["VERKAUF", "Verkauf"]].forEach(function (pair) {
      var b = document.createElement("button");
      b.textContent = pair[1];
      b.className = typ === pair[0] ? "on" : "";
      b.onclick = function () { typ = pair[0]; render(); };
      actions.appendChild(b);
    });
    app.appendChild(actions);
    if (typ === "FUTTER") {
      app.appendChild(choice("Delta", [-10, -5, 5, 10], delta, function (n) { delta = n; }));
      app.appendChild(choice("Rücknahme Tage", [3, 5, 7], tage, function (n) { tage = n; }));
    } else if (typ === "SPERREN") {
      app.appendChild(choice("Sperren", [1, 2], sperren, function (n) { sperren = n; }));
    } else {
      app.appendChild(choice("Anzahl", [1, 2, 3], anzahl, function (n) { anzahl = n; }));
      if (typ === "VERLUST") {
        app.appendChild(choice("Art", ["Tot", "Notgetötet"], art, function (n) { art = n; }));
        app.appendChild(choice("Ursache", ["Kümmerer", "Mastarm", "Lunge", "Anderes"], ursache, function (n) { ursache = n; }));
      }
    }
    if (view.jobs && view.jobs.length) {
      var h = document.createElement("h1");
      h.textContent = "Freigaben";
      app.appendChild(h);
      view.jobs.forEach(function (job) {
        var line = document.createElement("div");
        line.className = "muted";
        line.textContent = "#" + job.id + " " + job.typ + " " + job.status;
        app.appendChild(line);
        var go = document.createElement("button");
        go.textContent = "Jetzt senden";
        go.onclick = function () { send({ aktion: "freigabe", id: job.id, tun: "senden" }); };
        var stop = document.createElement("button");
        stop.textContent = "Abbrechen";
        stop.onclick = function () { send({ aktion: "freigabe", id: job.id, tun: "abbrechen" }); };
        app.appendChild(go); app.appendChild(stop);
      });
    }
    var ok = document.createElement("button");
    ok.className = "primary";
    ok.textContent = "In den Chat zur Bestätigung";
    ok.onclick = function () {
      var ventile = Object.keys(picked).filter(function (k) { return picked[k]; }).map(Number);
      var body = { aktion: "buchen", typ: typ, standort: view.standort, stall: view.stall, ventile: ventile };
      if (typ === "FUTTER") { body.delta = delta; body.tage = tage; body.sperren = 0; }
      if (typ === "SPERREN") { body.sperren = sperren; body.delta = 0; }
      if (typ === "VERLUST" || typ === "VERKAUF") body.anzahl = anzahl;
      if (typ === "VERLUST") { body.art = art; body.ursache = ursache; body.notiz = ""; }
      send(body);
    };
    app.appendChild(ok);
  }
  function choice(label, values, current, set) {
    var box = document.createElement("div");
    var cap = document.createElement("div");
    cap.className = "muted";
    cap.textContent = label;
    box.appendChild(cap);
    values.forEach(function (value) {
      var b = document.createElement("button");
      b.textContent = String(value);
      if (value === current) b.className = "on";
      b.onclick = function () { set(value); render(); };
      box.appendChild(b);
    });
    return box;
  }
  inflateZ(standText()).then(function (text) {
    state = parse(text || "");
    render();
  }).catch(function () {
    state = { art: "leer" };
    render();
  });
})();
</script>
</body>
</html>
